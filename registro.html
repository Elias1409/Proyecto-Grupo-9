<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta – FinTrack</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="auth-page">

    <div class="auth-hero">

        <div class="mark">
            <svg class="icon">
                <use href="assets/icons.svg#icon-user"></use>
            </svg>
        </div>

        <h1>Crea tu cuenta</h1>

        <p>
            Empieza a organizar tus ingresos, gastos,
            deudas y metas personales desde una sola plataforma.
        </p>

        <ul class="value-props">
            <li>Información organizada.</li>
            <li>Control financiero personal.</li>
            <li>Seguimiento de metas.</li>
        </ul>

    </div>


    <div class="auth-panel auth-panel-register">

        <div class="auth-card">

            <div class="logo">FinTrack</div>

            <h2>Crear usuario</h2>

            <div class="sub">
                Completa tus datos para registrarte
            </div>


            <form id="formRegistro">

                <div class="form-group">

                    <label
                        class="form-label"
                        for="registroNombre">

                        Nombre Completo

                    </label>

                    <input
                        id="registroNombre"
                        type="text"
                        class="form-control"
                        placeholder="Su nombre"
                        required>

                </div>


                <div class="form-group">

                    <label
                        class="form-label"
                        for="registroCorreo">

                        Correo Electronico

                    </label>

                    <input
                        id="registroCorreo"
                        type="email"
                        class="form-control"
                        placeholder="Su correo electronico"
                        required>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label
                            class="form-label"
                            for="registroClave">

                            Contraseña

                        </label>

                        <input
                            id="registroClave"
                            type="password"
                            class="form-control"
                            placeholder="Mínimo 8 caracteres"
                            required>

                    </div>


                    <div class="form-group">

                        <label
                            class="form-label"
                            for="registroConfirmar">

                            Confirmar

                        </label>

                        <input
                            id="registroConfirmar"
                            type="password"
                            class="form-control"
                            placeholder="Repite la contraseña"
                            required>

                    </div>

                </div>


                <div
                    id="registroMensaje"
                    class="form-message">
                </div>


                <button
                    type="submit"
                    class="btn btn-primary btn-full">

                    Crear Cuenta

                </button>

            </form>


            <div class="auth-footer">

                ¿Ya tienes una cuenta?

                <a href="index.html">
                    Iniciar sesión
                </a>

            </div>

        </div>

    </div>

</div>

<script src="js/app.js"></script>

</body>
</html>
